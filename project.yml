# XcodeGen project description. Run `xcodegen generate` to produce LocalMusic.xcodeproj.
name: LocalMusic
options:
  bundleIdPrefix: dev.localmusic
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
targets:
  LocalMusicCore:
    type: framework
    platform: macOS
    sources: [Sources/LocalMusicCore]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.localmusic.core
  LocalMusic:
    type: application
    platform: macOS
    sources:
      - path: Sources/LocalMusic
        excludes: ["Resources/Info.plist", "Resources/LocalMusic.entitlements"]
    dependencies:
      - target: LocalMusicCore
        embed: true
    info:
      path: Sources/LocalMusic/Resources/Info.plist
      properties:
        CFBundleIconFile: AppIcon
    entitlements:
      path: Sources/LocalMusic/Resources/LocalMusic.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.localmusic.app
        PRODUCT_NAME: LocalMusic
        ENABLE_APP_SANDBOX: NO
  LocalMusicTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/LocalMusicTests]
    dependencies:
      - target: LocalMusicCore
schemes:
  LocalMusic:
    build:
      targets:
        LocalMusic: all
        LocalMusicTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [LocalMusicTests]
